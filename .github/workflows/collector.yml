name: Telegram Collector Only

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r config/requirements.txt

      - name: Run Telegram Collector
        run: python src/telegram_collector.py

      - name: Export configs from database to all_servers.txt
        run: |
          if [ -f collector.db ]; then
            sqlite3 collector.db "SELECT config FROM configs;" | sed 's/&amp;/\&/g' > all_servers.txt
            COUNT=$(wc -l < all_servers.txt)
            echo "✅ $COUNT configs exported"
          else
            touch all_servers.txt
          fi

      - name: Keep only last 100 configs
        run: |
          if [ -f all_servers.txt ]; then
            tail -n 100 all_servers.txt > all_servers.tmp && mv all_servers.tmp all_servers.txt
          fi

      - name: Fix Config Remarks
        run: |
          if [ -f all_servers.txt ]; then
            python edit_remarks.py
          fi

      - name: Create perfect Base64 (Python)
        run: |
          python3 << 'EOF'
          import base64
          # خواندن فایل و حذف خطوط خالی و جایگزینی &amp;
          with open('all_servers.txt', 'r') as f:
              lines = [line.strip().replace('&amp;', '&') for line in f if line.strip()]
          if not lines:
              open('all_servers_base64.txt', 'w').close()
              print("Empty file")
          else:
              content = '\n'.join(lines)
              b64 = base64.b64encode(content.encode('utf-8')).decode('ascii')
              # حذف هرگونه whitespace اضافی
              b64 = b64.strip()
              with open('all_servers_base64.txt', 'w') as out:
                  out.write(b64)
              print(f"Base64 created with {len(lines)} configs")
          EOF

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add all_servers.txt all_servers_base64.txt collector.db data/ servers/ 2>/dev/null || true
          git commit -m "Update configs [skip ci]" || echo "No changes"
          git push