name: Telegram Collector Only

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r config/requirements.txt

      - name: Run Telegram Collector
        run: python src/telegram_collector.py

      - name: Export configs from database to all_servers.txt
        run: |
          if [ -f collector.db ]; then
            sqlite3 collector.db "SELECT config FROM configs;" > all_servers.txt
            COUNT=$(wc -l < all_servers.txt)
            echo "✅ $COUNT configs exported to all_servers.txt"
          else
            echo "⚠️ collector.db not found, creating empty all_servers.txt"
            touch all_servers.txt
          fi

      - name: Keep only last 100 configs
        run: |
          if [ -f all_servers.txt ]; then
            tail -n 100 all_servers.txt > all_servers.tmp && mv all_servers.tmp all_servers.txt
            COUNT=$(wc -l < all_servers.txt)
            echo "✅ Trimmed to ${COUNT} latest configs (last 100 lines)"
          else
            echo "⚠️ all_servers.txt not found, skipping trim"
          fi
          
      - name: Fix Config Remarks
        run: |
          if [ -f all_servers.txt ]; then
            python edit_remarks.py
          else
            echo "⚠️ all_servers.txt not found, skipping remark fix."
          fi
 
      - name: (Optional) Rebuild protocol files
        run: |
          if [ -f src/rebuild_protocols.py ]; then
            python src/rebuild_protocols.py
          fi

      # ===== SECTION 1: Commit the main text file =====
      - name: Commit all_servers.txt
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add all_servers.txt collector.db data/ servers/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update configs from Telegram [skip ci]"
            git push
          fi

      # ===== SECTION 2: Create the FINAL subscription file with metadata =====
      - name: Create final subscription file (Base64)
        run: |
          # ایجاد یک فایل موقت با هدرهای استاندارد سابسکریپشن
          # این کار باعث می‌شود v2rayNG آن را به عنوان یک سورس معتبر شناسایی کند
          echo "#profile-title: base64:VjJSb2R5IC0gQ29sbGVjdG9y" > temp_sub.txt
          echo "#profile-update-interval: 1" >> temp_sub.txt
          
          # اضافه کردن محتوای پالایش‌شده all_servers.txt به فایل موقت
          # دستور cat محتوا را خوانده و sed خطوط خالی را حذف می‌کند
          cat all_servers.txt | sed '/^\s*$/d' >> temp_sub.txt
          
          # ساخت فایل Base64 نهایی با حذف کامل whitespace اضافی (طبق استاندارد v2rayNG)[reference:2][reference:3]
          # پرچم -w 0 باعث می‌شود خروجی در یک خط باشد و 'tr -d' هم فضاهای احتمالی را حذف می‌کند
          BASE64_CONTENT=$(base64 -w 0 temp_sub.txt | tr -d ' \n\r')
          echo -n "$BASE64_CONTENT" > all_servers_base64.txt
          
          # پاکسازی فایل موقت
          rm temp_sub.txt
          
          echo "✅ Standard Base64 subscription file created: all_servers_base64.txt"

      - name: Commit the Base64 subscription file
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add all_servers_base64.txt
          git commit -m "Update Base64 subscription [skip ci]" || echo "No changes to commit."
          git push