name: Telegram Collector Only

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r config/requirements.txt

      - name: Run Telegram Collector
        run: python src/telegram_collector.py

      - name: Export configs from database to all_servers.txt
        run: |
          if [ -f collector.db ]; then
            sqlite3 collector.db "SELECT config FROM configs ORDER BY rowid DESC LIMIT 100;" > all_servers.txt
            COUNT=$(wc -l < all_servers.txt)
            echo "✅ $COUNT configs exported to all_servers.txt"
          else
            echo "⚠️ collector.db not found, creating empty all_servers.txt"
            touch all_servers.txt
          fi

         - name: Clean configs (replace &amp; with &)
           run: |
            if [ -s all_servers.txt ]; then
              python clean_configs.py
             else
              echo "⚠️ all_servers.txt empty, skipping clean"
             fi
 
      - name: Fix Config Remarks
        run: |
          if [ -f all_servers.txt ]; then
            python edit_remarks.py
          else
            echo "⚠️ all_servers.txt not found, skipping remark fix."
          fi
 
      - name: (Optional) Rebuild protocol files
        run: |
          if [ -f src/rebuild_protocols.py ]; then
            python src/rebuild_protocols.py
          fi


      - name: Commit and push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add all_servers.txt collector.db data/ servers/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update configs from Telegram [skip ci]"
            git push
          fi
