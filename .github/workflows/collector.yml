name: Telegram Collector Only

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r config/requirements.txt

      - name: Run Telegram Collector
        run: python src/telegram_collector.py

      - name: Export configs from database to all_servers.txt
        run: |
          if [ -f collector.db ]; then
            sqlite3 collector.db "SELECT config FROM configs;" > all_servers.txt
            COUNT=$(wc -l < all_servers.txt)
            echo "✅ $COUNT configs exported to all_servers.txt"
          else
            echo "⚠️ collector.db not found, creating empty all_servers.txt"
            touch all_servers.txt
          fi

      - name: Keep only last 100 configs
        run: |
          if [ -f all_servers.txt ]; then
            # نگهداری فقط ۱۰۰ خط آخر (جدیدترین کانفیگ‌ها)
            tail -n 100 all_servers.txt > all_servers.tmp && mv all_servers.tmp all_servers.txt
            COUNT=$(wc -l < all_servers.txt)
            echo "✅ Trimmed to ${COUNT} latest configs (last 100 lines)"
          else
            echo "⚠️ all_servers.txt not found, skipping trim"
          fi
          
      - name: Fix Config Remarks
        run: |
          if [ -f all_servers.txt ]; then
            python edit_remarks.py
          else
            echo "⚠️ all_servers.txt not found, skipping remark fix."
          fi
 
      - name: (Optional) Rebuild protocol files
        run: |
          if [ -f src/rebuild_protocols.py ]; then
            python src/rebuild_protocols.py
          fi

      # ===== مرحله جدید: ساخت فایل Base64 برای ساب‌اسکریپشن =====
      - name: Create Base64 subscription (fixed)
  run: |
    python3 << 'EOF'
    import base64
    # خواندن فایل و حذف خطوط خالی
    with open('all_servers.txt', 'r') as f:
        lines = [line.strip() for line in f if line.strip()]
    if not lines:
        print("⚠️ all_servers.txt is empty after cleaning")
        open('all_servers_base64.txt', 'w').close()
    else:
        # هر کانفیگ باید در یک خط باشد (قبلاً هست)
        content = '\n'.join(lines)
        # تبدیل به Base64 بدون newline اضافی
        b64 = base64.b64encode(content.encode('utf-8')).decode('ascii')
        # ذخیره بدون خط جدید در انتها
        with open('all_servers_base64.txt', 'w', newline='\n') as out:
            out.write(b64)
        print(f"✅ Base64 created with {len(lines)} configs, length {len(b64)}")
    EOF

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          # اضافه کردن فایل Base64 به لیست commit
          git add all_servers.txt all_servers_base64.txt collector.db data/ servers/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update configs from Telegram [skip ci]"
            git push
          fi