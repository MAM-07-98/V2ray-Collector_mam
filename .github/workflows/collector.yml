name: Telegram Collector Only

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r config/requirements.txt

      - name: Run Telegram Collector
        run: python src/telegram_collector.py

      - name: Export latest configs from database
        run: |
          if [ -f collector.db ]; then
            sqlite3 collector.db "SELECT config FROM configs ORDER BY rowid DESC LIMIT 200;" > all_servers.txt
            echo "✅ Exported $(wc -l < all_servers.txt) configs"
          else
            touch all_servers.txt
          fi

      - name: Split stuck links (اگر دو تا لینک به هم چسبیده باشند)
        run: |
          if [ -s all_servers.txt ] && [ -f src/split_links.py ]; then
            python src/split_links.py all_servers.txt
          fi

      - name: Remove duplicate configs (هوشمندانه)
        run: |
          if [ -s all_servers.txt ] && [ -f src/dedup_configs.py ]; then
            python src/dedup_configs.py all_servers.txt
          fi

      - name: Clean configs (جایگزینی &amp; و حذف پارامترهای خالی)
        run: |
          if [ -s all_servers.txt ]; then
            python clean_configs.py
          fi


      - name: Rebuild protocol files (تولید فایل‌های جداگانه برای هر پروتکل)
        run: |
          if [ -f src/rebuild_protocols.py ]; then
            python src/rebuild_protocols.py
          fi

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add all_servers.txt collector.db data/ servers/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update configs from Telegram [skip ci]"
            git push
          fi